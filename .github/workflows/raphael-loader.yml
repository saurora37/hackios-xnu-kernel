name: raphael loader

# Builds the XNU loader for the Redmi K20 Pro (raphael, SM8150).
# The kernel step is optional and long: the first milestone is that the loader compiles at all,
# because that is what validates platform_raphael field by field.
on:
  workflow_dispatch:
    inputs:
      build_kernel:
        description: "also build the XNU kernel (long: downloads xnu-deps, ~40 min)"
        type: boolean
        default: false
  push:
    branches: [k90-port]
    paths:
      - "xnuloader/**"
      - "common/devices/**"
      # The port's own kernel sources: a change to a driver has to reach the kernel build, and
      # without these two a fix can be pushed and never compiled.
      - "xnu/**"
      - "xnu26/**"
      - ".github/workflows/raphael-loader.yml"

permissions:
  contents: write

jobs:
  loader:
    # The loader is a freestanding AArch64 Windows-PE image: clang plus lld-link, nothing else.
    # That builds on Linux, so only the kernel job needs a macOS image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang and lld (lld-link lives in the lld package)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Check the toolchain
        run: |
          clang --version
          lld-link --version

      - name: Build the loader for raphael
        run: |
          EXTRA_CFLAGS="-DDIRECT_PHONE_PLAT -DRAPHAEL_PORT" \
          BUILD_ID="$(git rev-parse HEAD)" \
          ./xnuloader/build.sh

      - name: Show what came out
        run: |
          ls -la xnuloader/loader-phone.efi
          file xnuloader/loader-phone.efi || true

      - uses: actions/upload-artifact@v4
        with:
          name: loader-phone-raphael
          path: xnuloader/loader-phone.efi
          if-no-files-found: error

  kernel:
    # Dispatching with the box ticked is the normal route. A commit whose message carries
    # "[kernel]" also builds it, which is how a tooling fix can verify itself without
    # someone having to click Run workflow again.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_kernel) || contains(github.event.head_commit.message, '[kernel]') }}
    # macos-14 was retired from the hosted fleet, and a dead label shows up as a job that is
    # cancelled within twenty seconds with no steps run, not as a build error.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        # gmake, not make: macOS ships BSD make as `make`, while the xnu makefiles call gmake.
        # nproc, not sysctl: MakeInc.cmd asks nproc for the job count, and without it make is
        # handed an empty -j and dies printing its usage text instead of a real error.
        # nproc is shimmed rather than taking coreutils' libexec/gnubin on PATH: that directory
        # also shadows install with the GNU one, and the libkern header rule fails under it
        # ("install: target 'version.h': No such file or directory").
        run: |
          brew install llvm lld make
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/shim"
          printf '#!/bin/sh\nexec sysctl -n hw.ncpu\n' > "$RUNNER_TEMP/shim/nproc"
          chmod +x "$RUNNER_TEMP/shim/nproc"
          echo "$RUNNER_TEMP/shim" >> "$GITHUB_PATH"
      - name: Check the toolchain
        run: |
          gmake --version | head -1
          nproc
          command -v install
          clang --version | head -1
          xcodebuild -version | head -2

      # Every build step appends to kernel.log. The log of a failing run is not readable without
      # a signed-in account, so the errors and the tail are published on the ci-log branch.
      #
      # The sources and the built dependencies are cached: a run that fails deep in the compile
      # would otherwise spend its first four minutes rebuilding everything before reaching the
      # same file. Keyed on the patches, so a change to the port gets a clean tree.
      - name: Restore the sources and dependencies
        uses: actions/cache@v4
        with:
          path: |
            xnu-src
            xnu-deps
          key: xnu26-${{ hashFiles('xnu26/patches/**', 'xnu26/files/**', 'xnu/files/**', 'xnu26/apply.sh', 'xnu26/deps-macos.sh', 'xnu26/build-macos.sh', 'xnu26/env-macos.sh') }}

      - name: Fetch the 12377 sources and apply the series
        shell: bash
        run: |
          set -o pipefail
          if [ -d xnu-src/xnu-12377.121.6 ]; then
            echo 'apply.sh: tree restored from cache, patches already in place'
          else
            ./xnu26/apply.sh
          fi 2>&1 | tee -a kernel.log

      - name: Stage 1 dependencies
        shell: bash
        run: |
          set -o pipefail
          ./xnu26/deps-macos.sh --stage1 2>&1 | tee -a kernel.log

      - name: Export kernel headers
        shell: bash
        run: |
          set -o pipefail
          ./xnu26/build-macos.sh exporthdrs installhdrs 2>&1 | tee -a kernel.log

      - name: Stage 2 dependencies
        shell: bash
        run: |
          set -o pipefail
          ./xnu26/deps-macos.sh --stage2 2>&1 | tee -a kernel.log

      - name: Build the kernel
        shell: bash
        run: |
          set -o pipefail
          ./xnu26/build-macos.sh 2>&1 | tee -a kernel.log

      - name: Publish the kernel log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # An error deep in the compile is often thousands of lines above the tail, and the
          # run page truncates the log too, so the errors are copied out first.
          {
            echo '=== error lines ==='
            grep -n -m 80 -E 'error:|Error [12]|Undefined symbols|undefined reference|No rule to make|fatal error' kernel.log || true
            echo '=== tail ==='
            tail -n 2500 kernel.log 2>/dev/null || echo 'no kernel.log'
          } > .ci-log.txt
          rm -rf /tmp/logout && mkdir -p /tmp/logout && cd /tmp/logout
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cp "$GITHUB_WORKSPACE/.ci-log.txt" ./kernel-build-log.txt
          git add -A
          git -c user.name="raphael ci" -c user.email="ci@local" commit -q -m "ci: kernel build log (run $GITHUB_RUN_NUMBER)"
          git push -f origin HEAD:ci-log || true

      - uses: actions/upload-artifact@v4
        with:
          name: mach-bcm2837
          path: xnu-src/xnu-12377.121.6/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
          if-no-files-found: error

      - name: Publish the kernel on the ci-out branch
        # The packaging job lives in the Mu-Silicium fork and cannot read this repo's artifacts
        # (a GITHUB_TOKEN only reaches its own repository), so the kernel is parked on a public
        # branch where it can be fetched with plain curl.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          K=xnu-src/xnu-12377.121.6/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
          ls -l "$K"
          rm -rf /tmp/ciout && mkdir -p /tmp/ciout && cd /tmp/ciout
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cp "$GITHUB_WORKSPACE/$K" ./mach.development.bcm2837
          printf 'run %s, commit %s\n' "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" > BUILD.txt
          git add -A
          git -c user.name="raphael ci" -c user.email="ci@local" commit -q -m "ci: raphael kernel (run $GITHUB_RUN_NUMBER)"
          git push -f origin HEAD:ci-out
