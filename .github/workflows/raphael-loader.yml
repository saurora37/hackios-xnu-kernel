name: raphael loader

# Builds the XNU loader for the Redmi K20 Pro (raphael, SM8150).
# The kernel step is optional and long: the first milestone is that the loader compiles at all,
# because that is what validates platform_raphael field by field.
on:
  workflow_dispatch:
    inputs:
      build_kernel:
        description: "also build the XNU kernel (long: downloads xnu-deps, ~40 min)"
        type: boolean
        default: false
  push:
    branches: [k90-port]
    paths:
      - "xnuloader/**"
      - "common/devices/**"
      - ".github/workflows/raphael-loader.yml"

jobs:
  loader:
    # The loader is a freestanding AArch64 Windows-PE image: clang plus lld-link, nothing else.
    # That builds on Linux, so only the kernel job needs a macOS image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang and lld (lld-link lives in the lld package)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Check the toolchain
        run: |
          clang --version
          lld-link --version

      - name: Build the loader for raphael
        run: |
          EXTRA_CFLAGS="-DDIRECT_PHONE_PLAT -DRAPHAEL_PORT" \
          BUILD_ID="$(git rev-parse HEAD)" \
          ./xnuloader/build.sh

      - name: Show what came out
        run: |
          ls -la xnuloader/loader-phone.efi
          file xnuloader/loader-phone.efi || true

      - uses: actions/upload-artifact@v4
        with:
          name: loader-phone-raphael
          path: xnuloader/loader-phone.efi
          if-no-files-found: error

  kernel:
    if: ${{ inputs.build_kernel }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM
        run: |
          brew install llvm lld
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Fetch the 12377 sources and apply the series
        run: ./xnu26/apply.sh

      - name: Stage 1 dependencies
        run: ./xnu26/deps-macos.sh --stage1

      - name: Export kernel headers
        run: ./xnu26/build-macos.sh exporthdrs installhdrs

      - name: Stage 2 dependencies
        run: ./xnu26/deps-macos.sh --stage2

      - name: Build the kernel
        run: ./xnu26/build-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mach-bcm2837
          path: xnu-src/xnu-12377.121.6/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
          if-no-files-found: error
