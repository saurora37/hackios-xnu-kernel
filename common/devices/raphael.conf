# Device profile: Redmi K20 Pro / Mi 9T Pro (raphael, SM8150).
# Sourced by common/build.sh and common/run.sh. Values measured on the phone 2026-11-15:
#   DTB  -- Aloha's android-raphael.dtb (GIC, cores, UFS, uart, panel, reserved-memory)
#   iomem -- /proc/iomem under KernelSU (Kernel code at 0x80080000 proves FD_BASE)
NAME="Redmi K20 Pro / Mi 9T Pro (raphael)"
KIND=phone
SOC="Qualcomm SM8150 (Snapdragon 855)"
# --- boot chain (phones) ---------------------------------------------------------------------------
# TBD: a Mu-Silicium UEFI built for this phone. Project Aloha already has a first-class
# xiaomi-raphael package, so the device half exists; the HakiOS overlay (container -> PAYLOAD_BASE,
# BootManagerLib starting the XNU loader) is the part that still has to be produced.
UEFI_TARGET=raphael
UEFI_FD=
DTB=
FD_BASE=0x9FC00000             # where BootShim relocates the UEFI fd: free RAM from 0x9F800000 to 0xADC00000 per the device tree
FD_SIZE=0x00300000             # 3 MiB, ends at 0x9FF00000 below the SEC heap and UEFI stack; same window cepheus (Mi 9, SM8150) uses
PAYLOAD_BASE=0xB0000000        # inside the 204 MiB run 0xB0000000-0xBCC00000, nothing reserved there
PAYLOAD_CAP=0x08000000         # ends at 0xB8000000, still inside that run

# --- kernel and loader -----------------------------------------------------------------------------
FB_BASE=0x9C000000             # cont_splash_region@0x9c000000; -DRAPHAEL_PORT pins the platform regardless
LOADER_CFLAGS="-DDIRECT_PHONE_PLAT -DRAPHAEL_PORT"   # the phone macro plus this phone's platform

# --- what the run needs ----------------------------------------------------------------------------
BOOTARGS="touchscreen=2 cpus=8"   # 2 = goodix (GT9889 at I2C 0xc88000, addr 0x5d)
DEFAULT_SECS=900
USERLAND_VARS=""
# The phone's own firmware, taken from its Android (never in the repository): modem/bluetooth/NV
# partitions plus the Adreno 640 GMU and zap blobs.
FIRMWARE=""
